<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="model-title model-desc"><title id="model-title">The multi-layered system overview</title><desc id="model-desc">Four connected layers, from bottom to top: infrastructural, digital, cognitive and socio-cultural. Arrows show exchange in both directions. The infrastructural layer relates to material and spatial fabric. The digital layer relates to VR simulations, digital twins and ecosystems. The cognitive layer relates to human experience and neurophysiological tools. The socio-cultural layer relates to community, identity, memory and co-creation.</desc><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#222"/></marker></defs><g stroke="#555" stroke-width="1.5"><path d="M500 425L710 510L500 595L290 510Z" fill="#bdbdbd"/><path d="M500 295L710 380L500 465L290 380Z" fill="#d1d1d1"/><path d="M500 165L710 250L500 335L290 250Z" fill="#e5e5e5"/><path d="M500 35L710 120L500 205L290 120Z" fill="#f6f6f6"/></g><g fill="#171717" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle"><text x="500" y="115">SOCIO-CULTURAL<tspan x="500" dy="25">LAYER</tspan></text><text x="500" y="257">COGNITIVE LAYER</text><text x="500" y="387">DIGITAL LAYER</text><text x="500" y="505">INFRASTRUCTURAL<tspan x="500" dy="25">LAYER</tspan></text></g><g fill="none" stroke="#222" stroke-width="2"><path d="M355 510V175" marker-end="url(#arrowhead)"/><path d="M645 175V510" marker-end="url(#arrowhead)"/></g><g fill="none" stroke="#888" stroke-width="1.5"><path d="M675 115V65H745"/><path d="M325 250V210H255"/><path d="M675 380V340H745"/><path d="M325 510V475H255"/></g><g fill="#333" font-family="Arial,Helvetica,sans-serif" font-size="17"><text x="765" y="65">Community<tspan x="765" dy="25">Identity</tspan><tspan x="765" dy="25">Memory</tspan><tspan x="765" dy="25">Co-creation</tspan></text><text x="30" y="210">Human experience<tspan x="30" dy="25">Neurophysiological tools</tspan></text><text x="765" y="340">VR simulations<tspan x="765" dy="25">Digital twins</tspan><tspan x="765" dy="25">Ecosystems</tspan></text><text x="95" y="475">Material<tspan x="95" dy="25">Spatial fabric</tspan></text></g></svg>